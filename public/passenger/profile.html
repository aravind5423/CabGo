<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passenger Profile — CabGo</title>
  <meta name="description" content="Manage your personal details, default pickup address, and emergency contact." />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <script src="/js/router-guard.js" data-role="passenger"></script>
</head>
<body class="app-layout">

  <div class="app-main">
    <!-- Navbar -->
    <header class="dash-navbar">
      <a href="/passenger/dashboard.html" class="dash-brand">
        <div class="dash-brand-icon">🚖</div>
        <span>CabGo</span>
      </a>

      <nav>
        <ul class="dash-nav-links">
          <li><a href="/passenger/dashboard.html" class="dash-nav-link"><span>📊</span> Dashboard</a></li>
          <li><a href="/passenger/book-ride.html" class="dash-nav-link"><span>📍</span> Book Ride</a></li>
          <li><a href="/passenger/active-trip.html" class="dash-nav-link"><span>⚡</span> Active Trip</a></li>
          <li><a href="/passenger/trip-history.html" class="dash-nav-link"><span>📜</span> History</a></li>
          <li><a href="/passenger/profile.html" class="dash-nav-link active"><span>👤</span> Profile</a></li>
        </ul>
      </nav>

      <div class="dash-user-menu">
        <div class="dash-user-badge">
          <div class="user-avatar-circle" id="userAvatar">P</div>
          <span id="userName" style="font-weight: 500;">Passenger</span>
        </div>
        <button id="logoutBtn" class="btn btn-outline btn-sm" style="padding: 0.35rem 0.75rem;">Logout</button>
      </div>
    </header>

    <!-- Main Container -->
    <main class="app-container" style="max-width: 800px;">
      <div class="dash-header">
        <div class="dash-header-title">
          <h1>Account Profile</h1>
          <p>Update your personal details, home location, and emergency contacts.</p>
        </div>
      </div>

      <div class="dash-card">
        <form id="profileForm">
          <div style="display: flex; align-items: center; gap: 1.25rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
            <div class="user-avatar-circle" style="width: 64px; height: 64px; font-size: 1.8rem;" id="profileAvatar">P</div>
            <div>
              <h2 style="font-size: 1.3rem; margin: 0 0 0.25rem 0; color: #fff;" id="profileDisplayName">Passenger Name</h2>
              <span class="status-badge status-accepted" id="profileRole">Passenger</span>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            <div class="form-group">
              <label for="nameInput">Full Name</label>
              <input type="text" id="nameInput" class="form-control" required />
            </div>

            <div class="form-group">
              <label for="emailInput">Email Address (Read-only)</label>
              <input type="email" id="emailInput" class="form-control" disabled style="opacity: 0.6; cursor: not-allowed;" />
            </div>

            <div class="form-group">
              <label for="mobileInput">Mobile Number</label>
              <input type="tel" id="mobileInput" class="form-control" required pattern="[6-9][0-9]{9}" />
            </div>

            <div class="form-group">
              <label for="emergencyInput">Emergency Contact Number</label>
              <input type="tel" id="emergencyInput" class="form-control" placeholder="Optional 10-digit number" />
            </div>
          </div>

          <div class="form-group" style="margin-top: 1.25rem;">
            <label for="addressInput">Default Home / Office Address</label>
            <textarea id="addressInput" class="form-control" rows="2" placeholder="Your primary pickup location for one-click bookings"></textarea>
          </div>

          <div style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
            <button type="submit" id="saveProfileBtn" class="btn btn-primary">
              <span>Save Changes</span>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // User menu
      const uName = sessionStorage.getItem('user_name') || 'Passenger';
      document.getElementById('userName').textContent = uName;
      document.getElementById('userAvatar').textContent = uName.charAt(0).toUpperCase();

      document.getElementById('logoutBtn').addEventListener('click', () => {
        sessionStorage.clear();
        window.location.href = '/login.html';
      });

      // Fetch Profile Details
      async function loadProfile() {
        try {
          const res = await API.get('/api/passenger/profile');
          if (!res.success || !res.profile) {
            API.toast('Failed to load profile', 'error');
            return;
          }
          const p = res.profile;
          document.getElementById('profileDisplayName').textContent = p.name;
          document.getElementById('profileAvatar').textContent = p.name.charAt(0).toUpperCase();
          document.getElementById('nameInput').value = p.name || '';
          document.getElementById('emailInput').value = p.email || '';
          document.getElementById('mobileInput').value = p.mobile || '';
          document.getElementById('emergencyInput').value = p.emergency_contact || '';
          document.getElementById('addressInput').value = p.default_address || '';
        } catch (err) {
          console.error(err);
          API.toast('Network error loading profile', 'error');
        }
      }

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('saveProfileBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';

        try {
          const payload = {
            name:              document.getElementById('nameInput').value.trim(),
            mobile:            document.getElementById('mobileInput').value.trim(),
            default_address:   document.getElementById('addressInput').value.trim(),
            emergency_contact: document.getElementById('emergencyInput').value.trim(),
          };

          const res = await API.put('/api/passenger/profile', payload);
          if (res.success) {
            API.toast('Profile updated successfully!', 'success');
            sessionStorage.setItem('user_name', payload.name);
            document.getElementById('userName').textContent = payload.name;
            document.getElementById('profileDisplayName').textContent = payload.name;
          } else {
            API.toast(res.message || 'Failed to update profile', 'error');
          }
        } catch {
          API.toast('Error connecting to server', 'error');
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
        }
      });

      loadProfile();
    });
  </script>
</body>
</html>
