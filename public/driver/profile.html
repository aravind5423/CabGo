<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Partner Profile — CabGo</title>
  <meta name="description" content="View and update your driver profile, license credentials, and contact details." />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <script src="/js/router-guard.js" data-role="driver"></script>
</head>
<body class="app-layout">

  <div class="app-main">
    <!-- Navbar -->
    <header class="dash-navbar">
      <a href="/driver/dashboard.html" class="dash-brand">
        <div class="dash-brand-icon">🚗</div>
        <span>CabGo <small style="font-size: 0.65rem; background: #111; color: var(--accent-lime); padding: 2px 6px; border-radius: 4px; margin-left: 4px;">DRIVER</small></span>
      </a>

      <nav>
        <ul class="dash-nav-links">
          <li><a href="/driver/dashboard.html" class="dash-nav-link"><span>📊</span> Dashboard</a></li>
          <li><a href="/driver/ride-requests.html" class="dash-nav-link"><span>🔔</span> Requests</a></li>
          <li><a href="/driver/active-trip.html" class="dash-nav-link"><span>⚡</span> Active Trip</a></li>
          <li><a href="/driver/earnings.html" class="dash-nav-link"><span>💰</span> Earnings</a></li>
          <li><a href="/driver/vehicles.html" class="dash-nav-link"><span>🚗</span> Vehicles</a></li>
          <li><a href="/driver/profile.html" class="dash-nav-link active"><span>👤</span> Profile</a></li>
        </ul>
      </nav>

      <div class="dash-user-menu">
        <div class="dash-user-badge">
          <div class="user-avatar-circle" id="driverAvatar">D</div>
          <span id="driverNavName">Driver Partner</span>
        </div>
        <button id="logoutBtn" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </header>

    <!-- Main Container -->
    <main class="app-container">
      <section class="dash-header">
        <div class="dash-header-title">
          <h1>Driver Partner Profile</h1>
          <p>Account verification details, commercial driver license, and contact info.</p>
        </div>
        <div class="dash-header-actions">
          <a href="/driver/dashboard.html" class="btn btn-primary btn-sm">&larr; Return to Dashboard</a>
        </div>
      </section>

      <section class="dash-card" style="max-width: 720px; margin: 0 auto;">
        <div class="dash-card-header">
          <h2 class="dash-card-title"><span>👤</span> Personal & Commercial Credentials</h2>
        </div>

        <form id="profileForm" style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div class="form-group">
            <label style="font-size: 0.85rem; font-weight: 700; color: #111;">Full Name</label>
            <input type="text" id="profName" class="form-control" style="background: #F7F8F4; padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1);" required />
          </div>

          <div class="form-group">
            <label style="font-size: 0.85rem; font-weight: 700; color: #111;">Email Address (Read-only)</label>
            <input type="email" id="profEmail" class="form-control" style="background: #E2E8F0; padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); cursor: not-allowed;" readonly />
          </div>

          <div class="form-group">
            <label style="font-size: 0.85rem; font-weight: 700; color: #111;">Mobile Number</label>
            <input type="tel" id="profMobile" class="form-control" style="background: #F7F8F4; padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1);" required />
          </div>

          <div class="form-group">
            <label style="font-size: 0.85rem; font-weight: 700; color: #111;">Driver License Number</label>
            <input type="text" id="profLicense" class="form-control" style="background: #F7F8F4; padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1);" required />
          </div>

          <div style="margin-top: 1rem;">
            <button type="submit" id="saveBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
              Save Profile Changes
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = window.getCurrentUser ? window.getCurrentUser() : null;
      const userName = user?.name || sessionStorage.getItem('user_name') || 'Driver Partner';
      document.getElementById('driverNavName').textContent = userName;
      document.getElementById('driverAvatar').textContent = userName.charAt(0).toUpperCase();

      document.getElementById('logoutBtn').addEventListener('click', () => {
        sessionStorage.clear();
        window.location.href = '/login.html';
      });

      try {
        const res = await API.get('/api/driver/profile');
        if (res.success && res.profile) {
          const p = res.profile;
          document.getElementById('profName').value = p.name || '';
          document.getElementById('profEmail').value = p.email || '';
          document.getElementById('profMobile').value = p.mobile || '';
          document.getElementById('profLicense').value = p.license_no || '';
        }
      } catch (err) {
        console.error(err);
      }

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
          const res = await API.put('/api/driver/profile', {
            name: document.getElementById('profName').value.trim(),
            mobile: document.getElementById('profMobile').value.trim(),
            license_no: document.getElementById('profLicense').value.trim(),
          });
          if (res.success) {
            API.toast('Profile updated successfully!', 'success');
          } else {
            API.toast(res.message || 'Update failed', 'error');
          }
        } catch (e) {
          API.toast('Error connecting to server', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Save Profile Changes';
        }
      });
    });
  </script>
</body>
</html>
